[build]
  # No build command needed for static files
  command = "echo 'Frontend ready'"
  # Publish from root
  publish = "."

# Ignore backend files during deployment
ignore = "git diff --quiet HEAD^ HEAD -- app.py config.py models/ Procfile requirements.txt"

# Redirect API calls to backend
[[redirects]]
  from = "/classify"
  to = ":splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = ":splat"
  status = 200

[[redirects]]
  from = "/health"
  to = ":splat"
  status = 200

[[redirects]]
  from = "/about"
  to = "/templates/about.html"
  status = 200

# Catch-all for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/templates/index.html"
  status = 200

# Environment-specific settings

[context.production]
  environment = { API_URL = "https://your-railway-backend.up.railway.app" }

[context.deploy-preview]
  environment = { API_URL = "https://your-railway-backend.up.railway.app" }

[context.branch-deploy]
  environment = { API_URL = "https://your-railway-backend.up.railway.app" }

# Headers for security and CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Access-Control-Allow-Origin = "*"
